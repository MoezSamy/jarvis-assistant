
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061522">
<title>J.A.R.V.I.S | Prototype 02</title>

<link rel="manifest" href="./manifest.webmanifest">

<style>
:root {
  --bg: #061522;
  --panel: rgba(10, 35, 52, .88);
  --blue: #16c8ff;
  --cyan: #70eaff;
  --muted: #83a9bb;
  --white: #eafaff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 38%, #123b52 0%, #081d2c 38%, #030b13 100%);
  color: var(--white);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  padding: 25px 20px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(22,200,255,.25);
  padding-bottom: 15px;
}

.logo {
  color: var(--cyan);
  font-size: 19px;
  letter-spacing: 4px;
  font-weight: bold;
}

.status {
  font-size: 11px;
  color: #65e6a8;
  letter-spacing: 2px;
}

h1 {
  margin: 34px 0 5px;
  font-size: 30px;
  letter-spacing: 8px;
  font-weight: 300;
  text-shadow: 0 0 18px rgba(22,200,255,.5);
}

.subtitle {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 4px;
}

.core-wrap {
  width: 250px;
  height: 250px;
  margin: 42px auto 25px;
  display: grid;
  place-items: center;
  position: relative;
}

.ring {
  position: absolute;
  border: 1px solid rgba(22,200,255,.4);
  border-radius: 50%;
  animation: rotate 14s linear infinite;
}

.ring.one {
  width: 245px;
  height: 245px;
  border-top-color: var(--cyan);
  border-bottom-color: transparent;
}

.ring.two {
  width: 205px;
  height: 205px;
  border-style: dashed;
  animation-direction: reverse;
  animation-duration: 20s;
}

.core {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  background: radial-gradient(circle, #8af3ff 0%, #168ab9 18%, #06314c 58%, #061522 75%);
  box-shadow:
    0 0 25px #16c8ff,
    0 0 65px rgba(22,200,255,.45),
    inset 0 0 20px #8af3ff;
  transition: .3s;
}

.core.listening {
  animation: pulse 1s infinite alternate;
  box-shadow: 0 0 35px #16c8ff, 0 0 90px #16c8ff;
}

.core.speaking {
  animation: pulse .45s infinite alternate;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  from { transform: scale(.94); }
  to { transform: scale(1.06); }
}

.message {
  width: 100%;
  min-height: 75px;
  text-align: center;
  color: var(--cyan);
  font-size: 16px;
  line-height: 1.7;
  padding: 8px 12px;
  overflow-wrap: anywhere;
}

.transcript {
  width: 100%;
  min-height: 38px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  direction: auto;
  overflow-wrap: anywhere;
}

.controls {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

button, select, input {
  font: inherit;
}

button {
  border: 1px solid rgba(22,200,255,.55);
  background: rgba(10,45,65,.75);
  color: var(--cyan);
  border-radius: 10px;
  padding: 14px 10px;
  cursor: pointer;
  transition: .2s;
}

button:active {
  transform: scale(.97);
  background: rgba(22,200,255,.2);
}

button.primary {
  background: rgba(10,125,165,.25);
  border-color: var(--blue);
}

button.stop {
  border-color: rgba(255,100,100,.6);
  color: #ffaaaa;
}

.settings {
  width: 100%;
  margin-top: 27px;
  padding: 17px;
  border: 1px solid rgba(22,200,255,.22);
  background: var(--panel);
  border-radius: 13px;
}

.settings label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 9px;
}

select, input {
  width: 100%;
  border: 1px solid rgba(22,200,255,.35);
  background: #071b29;
  color: white;
  border-radius: 8px;
  padding: 12px;
  outline: none;
}

.settings button {
  width: 100%;
  margin-top: 12px;
}

.input-area {
  width: 100%;
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.input-area input {
  flex: 1;
  min-width: 0;
}

.input-area button {
  padding: 12px 17px;
}

.footer {
  margin-top: auto;
  padding-top: 35px;
  color: #52778a;
  font-size: 10px;
  letter-spacing: 3px;
  text-align: center;
}

.small-note {
  margin-top: 12px;
  color: #63899a;
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
}
</style>
</head>

<body>
<main class="app">

  <header class="header">
    <div class="logo">STARK SYSTEMS</div>
    <div class="status" id="status">● ONLINE</div>
  </header>

  <h1>J.A.R.V.I.S</h1>
  <div class="subtitle">PERSONAL ASSISTANT</div>

  <div class="core-wrap">
    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="core" id="core"></div>
  </div>

  <div class="message" id="message">
    Good day. I'm ready when you are.
  </div>

  <div class="transcript" id="transcript">
    Awaiting your command...
  </div>

  <div class="controls">
    <button class="primary" id="listenBtn">🎙 Start Listening</button>
    <button class="stop" id="stopBtn">■ Stop</button>
    <button id="greetBtn">Test Voice</button>
    <button id="repeatBtn">Repeat Greeting</button>
  </div>

  <section class="settings">
    <label for="language">ASSISTANT LANGUAGE</label>
    <select id="language">
      <option value="auto">Automatic / تلقائي</option>
      <option value="en-GB">British English</option>
      <option value="ar-EG">Egyptian Arabic</option>
    </select>

    <label for="voice" style="margin-top:16px">AVAILABLE VOICE</label>
    <select id="voice">
      <option value="">Loading voices...</option>
    </select>

    <button id="refreshVoices">Refresh Available Voices</button>
  </section>

  <div class="input-area">
    <input id="textInput" type="text"
      placeholder="Type a command... / اكتب أمرك">
    <button id="sendBtn">Send</button>
  </div>

  <div class="small-note">
    Voice availability depends on your device's installed speech services.
  </div>

  <footer class="footer">
    J.A.R.V.I.S · PROTOTYPE 02
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);

const core = $("core");
const message = $("message");
const transcript = $("transcript");
const status = $("status");
const language = $("language");
const voiceSelect = $("voice");

let voices = [];
let recognition = null;
let lastGreeting = "";
let currentLanguage = "en-GB";

function loadVoices() {
  if (!("speechSynthesis" in window)) {
    voiceSelect.innerHTML = '<option>Speech not supported</option>';
    return;
  }

  voices = speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  if (!voices.length) {
    voiceSelect.innerHTML = '<option value="">No voices found yet</option>';
    return;
  }

  voices.forEach((voice, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = voice.name + " — " + voice.lang;
    voiceSelect.appendChild(option);
  });

  const preferred = voices.findIndex(v =>
    v.lang.toLowerCase() === "en-gb" &&
    /daniel|arthur|oliver|male/i.test(v.name)
  );

  const egyptian = voices.findIndex(v =>
    v.lang.toLowerCase() === "ar-eg"
  );

  const fallbackEnglish = voices.findIndex(v =>
    v.lang.toLowerCase().startsWith("en-gb")
  );

  const fallbackArabic = voices.findIndex(v =>
    v.lang.toLowerCase().startsWith("ar")
  );

  const chosen = preferred >= 0 ? preferred :
    fallbackEnglish >= 0 ? fallbackEnglish :
    egyptian >= 0 ? egyptian : fallbackArabic;

  if (chosen >= 0) voiceSelect.value = chosen;
}

if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function getVoice(lang) {
  const selected = voices[Number(voiceSelect.value)];

  if (selected && selected.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())) {
    return selected;
  }

  if (lang === "ar-EG") {
    return voices.find(v => v.lang.toLowerCase() === "ar-eg") ||
      voices.find(v => v.lang.toLowerCase().startsWith("ar"));
  }

  return voices.find(v => v.lang.toLowerCase() === "en-gb") ||
    voices.find(v => v.lang.toLowerCase().startsWith("en"));
}

function speak(text, lang = currentLanguage) {
  if (!("speechSynthesis" in window)) {
    message.textContent = "Speech output is not supported in this browser.";
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = 0.94;
  utterance.pitch = 0.88;

  const voice = getVoice(lang);
  if (voice) utterance.voice = voice;

  utterance.onstart = () => {
    core.classList.add("speaking");
    status.textContent = "● SPEAKING";
  };

  utterance.onend = () => {
    core.classList.remove("speaking");
    status.textContent = "● ONLINE";
  };

  utterance.onerror = () => {
    core.classList.remove("speaking");
    status.textContent = "● ONLINE";
  };

  speechSynthesis.speak(utterance);
}

function greeting(lang) {
  if (lang === "ar-EG") {
    return "أهلاً، أنا جارفس. تحت أمرك، تحب أساعدك في إيه؟";
  }

  return "Good day. I'm Jarvis, at your service. How may I assist you?";
}

function detectLanguage(text) {
  return /[\u0600-\u06FF]/.test(text) ? "ar-EG" : "en-GB";
}

function respond(text) {
  const detected = language.value === "auto"
    ? detectLanguage(text)
    : language.value;

  currentLanguage = detected;
  transcript.textContent = text;

  const lower = text.toLowerCase().trim();

  let reply;

  if (detected === "ar-EG") {
    if (/ازيك|إزيك|السلام عليكم|صباح الخير|مساء الخير/.test(lower)) {
      reply = "أهلاً بيك! عامل إيه؟ أنا جاهز، قولّي تحب نعمل إيه.";
    } else if (/اسمك/.test(lower)) {
      reply = "أنا جارفس، مساعدك الشخصي. تحت أمرك.";
    } else if (/بتعمل ايه|بتعمل إيه|ممكن تساعدني/.test(lower)) {
      reply = "أقدر أساعدك في شوية أوامر وتجارب صوتية دلوقتي. ولسه بنطوّر إمكانياتي.";
    } else if (/الوقت|الساعة كام/.test(lower)) {
      reply = "الساعة دلوقتي " +
        new Date().toLocaleTimeString("ar-EG", {
          hour: "numeric", minute: "2-digit"
        });
    } else if (/التاريخ|النهارده كام/.test(lower)) {
      reply = "النهارده " +
        new Date().toLocaleDateString("ar-EG", {
          weekday: "long", day: "numeric", month: "long"
        });
    } else if (/شكرا|شكراً/.test(lower)) {
      reply = "العفو، ده واجبي. أنا تحت أمرك.";
    } else if (/باي|مع السلامة/.test(lower)) {
      reply = "مع السلامة، يومك جميل.";
    } else {
      reply = "حاضر. فهمت إنك بتقول: " + text +
        ". لسه محتاجين نوصلني بنظام ذكاء اصطناعي علشان أقدر أرد على أي سؤال.";
    }
  } else {
    if (/hello|hi|hey|good morning|good evening/.test(lower)) {
      reply = "Hello. It's good to hear from you. How can I help?";
    } else if (/your name|who are you/.test(lower)) {
      reply = "I'm Jarvis, your personal assistant.";
    } else if (/time/.test(lower)) {
      reply = "The current time is " +
        new Date().toLocaleTimeString("en-GB", {
          hour: "2-digit", minute: "2-digit"
        });
    } else if (/date|today/.test(lower)) {
      reply = "Today is " +
        new Date().toLocaleDateString("en-GB", {
          weekday: "long", day: "numeric", month: "long"
        });
    } else if (/thank/.test(lower)) {
      reply = "You're very welcome. Always happy to assist.";
    } else if (/bye|goodbye/.test(lower)) {
      reply = "Goodbye. Have a pleasant day.";
    } else {
      reply = "Understood. You said: " + text +
        ". I still need an AI connection to answer general questions.";
    }
  }

  message.textContent = reply;
  speak(reply, detected);
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    message.textContent =
      "Voice recognition isn't available in this browser. Try Chrome.";
    return;
  }

  if (recognition) recognition.abort();

  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = language.value === "auto"
    ? "en-GB"
    : language.value;

  recognition.onstart = () => {
    core.classList.add("listening");
    status.textContent = "● LISTENING";
    message.textContent = language.value === "ar-EG"
      ? "سامعك، اتفضل..."
      : "I'm listening...";
  };

  recognition.onresult = event => {
    const text = event.results[0][0].transcript;
    respond(text);
  };

  recognition.onerror = event => {
    message.textContent = "Voice input issue: " + event.error;
    core.classList.remove("listening");
    status.textContent = "● ONLINE";
  };

  recognition.onend = () => {
    core.classList.remove("listening");
    if (!core.classList.contains("speaking")) {
      status.textContent = "● ONLINE";
    }
  };

  recognition.start();
}

$("listenBtn").addEventListener("click", startListening);

$("stopBtn").addEventListener("click", () => {
  if (recognition) recognition.abort();
  if ("speechSynthesis" in window) speechSynthesis.cancel();

  core.classList.remove("listening", "speaking");
  status.textContent = "● ONLINE";
  message.textContent = "Standing by.";
});

$("greetBtn").addEventListener("click", () => {
  const lang = language.value === "auto"
    ? currentLanguage
    : language.value;

  const text = greeting(lang);
  message.textContent = text;
  speak(text, lang);
});

$("repeatBtn").addEventListener("click", () => {
  const lang = language.value === "auto"
    ? currentLanguage
    : language.value;

  speak(greeting(lang), lang);
});

$("sendBtn").addEventListener("click", () => {
  const text = $("textInput").value.trim();
  if (!text) return;

  $("textInput").value = "";
  respond(text);
});

$("textInput").addEventListener("keydown", event => {
  if (event.key === "Enter") $("sendBtn").click();
});

$("refreshVoices").addEventListener("click", () => {
  loadVoices();
  message.textContent = "Available voices refreshed.";
});

language.addEventListener("change", () => {
  currentLanguage = language.value === "auto"
    ? currentLanguage
    : language.value;

  message.textContent = language.value === "ar-EG"
    ? "أهلاً بيك. جارفس جاهز."
    : "Jarvis is standing by.";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>

</body>
</html>
